# Layer of every workspace crate. Target architecture and rules:
# docs/architecture/layered-rewrite.md §3. Checked by
# scripts/architecture/check_layers.py (normal and build dependencies; dev
# dependencies are a crate's own tests and are not checked).
#
# A crate may depend on the layers listed in `may_use` of its own layer.
# Feature crates may also depend on crates of their own `group` (one feature
# is often several crates); never on another group's crates.
#
# Today's violations are recorded in architecture/layer-violations.txt. That
# list may only shrink: a new violation fails the check, a fixed one must be
# removed from the list (`--update`).
#
# Helio is core only (docs/architecture/plugin-migration.md, "C. Helio repo is
# core only"): no crate outside the test host (`test_host = true`) may name an
# object kind, whose contracts are its plugin's (Pulsar-Native
# plugins/vendor/<kind>). [kinds] lists each kind's words; the check reads
# identifiers and key-like string literals of every .rs/.wgsl file (comments,
# prose strings and tests left out). What still names a kind is recorded with
# its reason in architecture/kind-names.txt, a list that may only shrink.

[layers.leaf]
about = "No dependency on any other workspace crate."
may_use = []

[layers.core]
about = "gpu + graph (helio-core today; splits into helio-gpu and helio-graph in phase 2)."
may_use = ["leaf"]

[layers.scene]
about = "Buffer contracts, the scene join's building blocks and the derivations no kind owns (hierarchy resolve). No components, no kind."
may_use = ["scene", "core", "leaf"]

[layers.feature_api]
about = "What a feature registers (node types, contracts, settings) and the frame it registers into (helio-frame-api: slots, draw phases, lighting inputs, the colour chain). Knows no renderer, no feature and no kind of object."
may_use = ["feature_api", "scene", "core", "leaf"]

[layers.api]
about = "A feature's public contract: graph keys, row ABIs, WGSL snippets, stand-ins. No state. Any feature may read another's api."
may_use = ["feature_api", "scene", "core", "leaf"]

[layers.spine]
about = "Core deferred pipeline and its extension points."
may_use = ["spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.feature]
about = "One rendering feature per group. Same group, spine and below; never another group."
may_use = ["spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.renderer]
about = "The Renderer facade. Knows no feature."
may_use = ["renderer", "spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.preset]
about = "Graph assets, node registries, feature lists."
may_use = ["preset", "renderer", "feature", "spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.host]
about = "Examples, demos, importers, tools: anything goes."
may_use = ["host", "preset", "renderer", "feature", "spine", "api", "feature_api", "scene", "core", "leaf"]

[crates]
# leaf
helio-settings = { layer = "leaf" }
helio-bake-types = { layer = "leaf" }
scenedb-inspector-agent = { layer = "leaf" }
helio-passes = { layer = "leaf" }

# core
helio-core = { layer = "core" }

# scene
helio-scene-join = { layer = "scene" }

# feature api
helio-feature-api = { layer = "feature_api" }
helio-frame-api = { layer = "feature_api" }

# spine
helio-pass-hiz = { layer = "spine" }
helio-pass-tsr = { layer = "spine" }
helio-pass-postprocess = { layer = "spine" }
helio-spine = { layer = "spine" }

# features
helio-pass-ssr = { layer = "feature", group = "reflections" }
helio-pass-planar-reflection = { layer = "feature", group = "reflections" }
helio-pass-fxaa = { layer = "feature", group = "post-aa" }
helio-pass-debug-overlay = { layer = "feature", group = "debug" }
helio-pass-perf-overlay = { layer = "feature", group = "debug" }
helio-pass-buffer-view = { layer = "feature", group = "debug" }
helio-pass-simple-cube = { layer = "feature", group = "debug" }
helio-pass-sdf = { layer = "feature", group = "sdf" }
helio-bake = { layer = "feature", group = "bake" }

# renderer
helio = { layer = "renderer" }
helio-xr = { layer = "renderer" }

# presets
helio-presets = { layer = "preset" }
helio-scene-derivations = { layer = "scene" }
helio-graph-asset = { layer = "preset" }

# hosts
examples = { layer = "host", test_host = true }
helio-controls = { layer = "host" }
helio-wasm = { layer = "host" }
helio-components = { layer = "host", test_host = true }  # SceneDB components for Helio's own hosts

[budgets]
# `#[derive(SceneStore)]` structs below the host layer. Components belong to
# whoever produces the data (an engine's plugins; for Helio's own hosts,
# helio-components), never to the renderer (layered-rewrite.md §3, phase 1).
scene_store_derives = 0

[kinds]
# Words (lower case, a multi-word term matches consecutive words of an
# identifier: `PostProcessVolume` is "post process volume") that name each
# kind. Words the frame owns are not here: "light" (the light list and
# directional lights are lighting inputs), "sky" (the sky lighting input),
# "shadow" (the shadow-caster phase), "reflection" (indirect specular).
meshes = ["mesh", "meshes", "meshlet", "meshopt", "vg", "virtual geometry", "skinned", "skinning", "skeletal"]
lights = ["ies", "hlfs", "light field", "reflection capture", "reflection captures"]
materials = ["material", "materials"]
sky = ["atmosphere", "cloud", "clouds"]
fog = ["fog", "fogged"]
post = ["post process volume", "post process volumes", "pp volume", "pp volumes"]
lens = ["lens", "lenses", "flare"]
water = ["water", "caustic", "caustics"]
foliage = ["foliage"]
voxel = ["voxel", "voxels", "terrain"]
decals = ["decal", "decals"]
particles = ["particle", "particles", "corona"]
sprites = ["sprite", "sprites"]
portals = ["portal", "portals"]
splines = ["spline", "splines"]
gi = ["gi", "ddgi"]
baked-lighting = ["lightmap", "lightmaps", "baked", "pvs"]

[renamed]
# Old crate names in git history -> today's crate, for the co-change report.
helio-default-graphs = "helio-presets"
helio-default-passes = "helio-presets"
