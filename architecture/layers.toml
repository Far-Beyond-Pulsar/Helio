helio-voxel-examples = { layer = "host", group = "voxel" }   # voxel_craft, voxel_flight, water_world

[sealed_groups]
# Group -> why it is sealed. Every object kind is a plugin that owns its
# feature (docs/architecture/plugin-migration.md): Helio, its presets and its
# other hosts may not depend on a kind's crates. Helio-Voxel lives in voxel/
# until it moves out (layered-rewrite.md phase 6); the engine adds its
# feature (`Preset::with_features`).
voxel = "Helio-Voxel: the pulsar.voxel plugin's feature, data and hosts (voxel/)"

[budgets]
# `#[derive(SceneStore)]` structs below the host layer. Components belong to
# whoever produces the data (an engine's plugins; for Helio's own hosts,
# helio-components), never to the renderer (layered-rewrite.md §3, phase 1).
scene_store_derives = 0

[renamed]
# Old crate names in git history -> today's crate, for the co-change report.
helio-default-graphs = "helio-presets"
helio-default-passes = "helio-presets"
