# Layer of every workspace crate. Target architecture and rules:
# docs/architecture/layered-rewrite.md §3. Checked by
# scripts/architecture/check_layers.py (normal and build dependencies; dev
# dependencies are a crate's own tests and are not checked).
#
# A crate may depend on the layers listed in `may_use` of its own layer.
# Feature crates may also depend on crates of their own `group` (one feature
# is often several crates); never on another group's crates.
#
# Today's violations are recorded in architecture/layer-violations.txt. That
# list may only shrink: a new violation fails the check, a fixed one must be
# removed from the list (`--update`).
#
# A sealed group ([sealed_groups]) is an object kind's code that Helio does not
# own: its crates may only be depended on (normal/build) by crates of the same
# group, whatever their layers. Breaking that is an error, never recorded.

[layers.leaf]
about = "No dependency on any other workspace crate."
may_use = []

[layers.core]
about = "gpu + graph (helio-core today; splits into helio-gpu and helio-graph in phase 2)."
may_use = ["leaf"]

[layers.scene]
about = "Buffer contracts and the scene-input projection; materials ABI. No components."
may_use = ["core", "leaf"]

[layers.feature_api]
about = "What a feature registers: node types, contracts, settings. Knows no renderer and no feature."
may_use = ["scene", "core", "leaf"]

[layers.api]
about = "A feature's public contract: graph keys, row ABIs, WGSL snippets, stand-ins. No state. Any feature may read another's api."
may_use = ["feature_api", "scene", "core", "leaf"]

[layers.spine]
about = "Core deferred pipeline and its extension points."
may_use = ["spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.feature]
about = "One rendering feature per group. Same group, spine and below; never another group."
may_use = ["spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.renderer]
about = "The Renderer facade. Knows no feature."
may_use = ["renderer", "spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.preset]
about = "Graph assets, node registries, feature lists."
may_use = ["preset", "renderer", "feature", "spine", "api", "feature_api", "scene", "core", "leaf"]

[layers.host]
about = "Examples, demos, importers, tools: anything goes."
may_use = ["host", "preset", "renderer", "feature", "spine", "api", "feature_api", "scene", "core", "leaf"]

