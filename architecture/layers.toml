helio-pass-vg = { layer = "feature", group = "vg" }
helio-pass-vg-bvh = { layer = "feature", group = "vg" }
helio-pass-vg-cull = { layer = "feature", group = "vg" }
helio-pass-vg-dense = { layer = "feature", group = "vg" }
helio-pass-vg-raster = { layer = "feature", group = "vg" }
helio-pass-vg-shade = { layer = "feature", group = "vg" }
helio-vg-format = { layer = "feature", group = "vg" }
helio-vg-build = { layer = "feature", group = "vg" }
helio-vg-stream = { layer = "feature", group = "vg" }
helio-pass-billboard = { layer = "feature", group = "billboards" }
helio-pass-ssr = { layer = "feature", group = "reflections" }
helio-pass-planar-reflection = { layer = "feature", group = "reflections" }
helio-pass-hlfs = { layer = "feature", group = "hlfs" }
helio-pass-fxaa = { layer = "feature", group = "post-aa" }
helio-pass-debug-overlay = { layer = "feature", group = "debug" }
helio-pass-perf-overlay = { layer = "feature", group = "debug" }
helio-pass-buffer-view = { layer = "feature", group = "debug" }
