[package]
name = "helio-workspace"
version = "0.0.0"
edition = "2021"
publish = false
description = "Workspace root"

[lib]
path = "src/lib.rs"

[[bin]]
name = "web"
path = "src/bin/web.rs"

[workspace]
members = [
    "crates/*",
    "crates/passes/2d/*",
    "crates/passes/3d/*",
    "crates_other/*"
]
exclude = [
    "vendor/nebula",
    # Bake output, not a crate. Lands here when a demo is run with `crates/` as
    # the working directory, and the `crates/*` member glob would otherwise try
    # to read it as a workspace member and fail.
    "crates/bake_cache",
    # helio_component declares `package.workspace = "../../../../.."` (belongs to
    # Pulsar-Native's root workspace, not this one -- see its own Cargo.toml
    # doc comment for why: inventory-based registry identity with
    # pulsar_scenedb/pulsar_reflection requires it to share exactly
    # Pulsar-Native's resolution, not this workspace's). A crate can't
    # simultaneously be swept up by this workspace's `crates/*` glob AND
    # declare a different governing workspace, so it's excluded here.
    "crates/helio-component",
]
resolver = "2"

[workspace.dependencies]
wgpu = { version = "30.0.0", default-features = true, features = ["vulkan", "vulkan-portability", "metal", "dx12", "gles", "webgpu", "wgsl"] }
blade-graphics = { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
blade-macros =   { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
winit = { version = "0.30.12", default-features = false, features = ["rwh_06"] }
egui = "0.36.1"
egui-wgpu = { version = "0.36.1", default-features = false }
egui-winit = { version = "0.36.1", default-features = false }
env_logger = "0.11"
log = "0.4"
# Required as a *direct* dependency (not just transitively via
# pulsar_reflection) by any crate using #[derive(Reflectable)] -- its
# generated code writes `::serde_json::Value`, and `::crate_name` paths
# resolve against the compiling crate's own direct dependencies (the 2018+
# extern prelude), not a proc-macro crate's.
serde_json = "1"

# SolidRS - 3D asset loading library
solid-rs =   { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-gltf = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-fbx =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-obj =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-usd =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
solid-unreal = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "4724f4f32b28a8ef6fe9ca2b2b59ea87a8e85ced" }
quark = { git = "https://github.com/Far-Beyond-Pulsar/Quark", package = "quark" }
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
helio-core = { path = "crates/helio-core" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "8f98f83", features = ["gpu"] }
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "8f98f83" }
# Must stay pinned to the exact rev pulsar_scenedb's own Cargo.toml pins --
# a different rev is a different SourceId and thus a second,
# type-incompatible copy of this crate in the build (see helio-wasm's
# BufferKey mismatch, hit and fixed earlier from exactly this). Every crate
# that needs the Reflectable derive should depend on this workspace entry,
# never its own direct git pin -- same reasoning as pulsar_scenedb's fleet
# of stale per-crate pins fixed in the same session.
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "1c64758" }
helio-default-graphs = { path = "crates/helio-default-graphs"}
wasm-bindgen = "0.2"
helio-pass-tsr = { path = "crates/passes/3d/helio-pass-tsr" }
helio-pass-portal-cull = { path = "crates/passes/3d/helio-pass-portal-cull" }
helio-pass-portal-instances = { path = "crates/passes/3d/helio-pass-portal-instances" }
helio-pass-postprocess = { path = "crates/passes/3d/helio-pass-postprocess" }
helio-pass-volumetric-fog = { path = "crates/passes/3d/helio-pass-volumetric-fog" }
helio = { path = "crates/helio" }
libhelio = { path = "crates/libhelio" }
helio-xr = { path = "crates/helio-xr" }
helio-asset-compat = { path = "crates/helio-asset-compat" }
helio-pass-foliage-place = { path = "crates/passes/3d/helio-pass-foliage-place" }
helio-pass-foliage-gbuffer = { path = "crates/passes/3d/helio-pass-foliage-gbuffer" }
helio-pass-planetary-voxel = { path = "crates/passes/3d/helio-pass-planetary-voxel" }
helio-pass-corona = { path = "crates/passes/3d/helio-pass-corona" }
helio-pass-flare = { path = "crates/passes/3d/helio-pass-flare" }
helio-pass-decal = { path = "crates/passes/3d/helio-pass-decal" }
helio-pass-sdf = { path = "crates/passes/3d/helio-pass-sdf" }
helio-pass-voxel-mesh = { path = "crates/passes/3d/helio-pass-voxel-mesh" }
helio-pass-fxaa = { path = "crates/passes/3d/helio-pass-fxaa" }
helio-pass-dof = { path = "crates/passes/3d/helio-pass-dof" }
helio-pass-sprite-batch = { path = "crates/passes/2d/helio-pass-sprite-batch" }
helio-pass-sprite-cull = { path = "crates/passes/2d/helio-pass-sprite-cull" }
helio-pass-sprite-simulate = { path = "crates/passes/2d/helio-pass-sprite-simulate" }
helio-pass-radiance-cascades-2d = { path = "crates/passes/2d/helio-pass-radiance-cascades-2d" }
helio-pass-sky = { path = "crates/passes/3d/helio-pass-sky" }
helio-pass-billboard = { path = "crates/passes/3d/helio-pass-billboard" }
helio-controls = { path = "crates/helio-controls" }
microfont = "3.7.8"

[dependencies]
tiny_http = "0.12"
ratatui = "0.29"
crossterm = "0.28"
