[workspace]
members = [
    "crates/*",
    "crates/passes/3d/*",
]
exclude = [
    "vendor/nebula",
    # Bake output, not a crate. Lands here when a demo is run with `crates/` as
    # the working directory, and the `crates/*` member glob would otherwise try
    # to read it as a workspace member and fail.
    "crates/bake_cache",
]
resolver = "2"

[workspace.dependencies]
# DX12 compiles shaders with DXC, linked statically: wgpu's fallback, FXC,
# takes minutes on the renderer's pipelines (and is unmaintained).
wgpu = { version = "30.0.0", default-features = true, features = ["vulkan", "vulkan-portability", "metal", "dx12", "static-dxc", "gles", "webgpu", "wgsl"] }
blade-graphics = { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
blade-macros =   { git = "https://github.com/tristanpoland/blade", rev = "d85bd14a78ed7729abc298906e87332257674a02" }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
# The Linux backends are listed here, not left to whichever crate happens to
# enable them: a crate that uses winit directly gets no backend otherwise, and
# winit refuses to compile on Linux (Windows and macOS need no feature).
winit = { version = "0.30.12", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
# Published Pulsar-Native profiler (including cross-thread scope contexts) -- the same
# collector that powers the editor flamegraph. Feature-flag aliased below so
# the fork's `profile_scope!` coexists with the compile-time `profiling`
# feature already gating helio-core's per-pass CpuProfiler.
profiling = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Native", rev = "45cda191beb316fee0859ae40d59f0dff986a66a" }
egui = "0.36.1"
egui-wgpu = { version = "0.36.1", default-features = false }
egui-winit = { version = "0.36.1", default-features = false }
env_logger = "0.11"
log = "0.4"
# Shader hot reload file watcher (helio-core `shader-hot-reload`). Same version
# as Pulsar-Native's root workspace so the two resolve to one copy.
notify = "8.2.0"
# Required as a *direct* dependency (not just transitively via
# pulsar_reflection) by any crate using #[derive(Reflectable)] -- its
# generated code writes `::serde_json::Value`, and `::crate_name` paths
# resolve against the compiling crate's own direct dependencies (the 2018+
# extern prelude), not a proc-macro crate's.
serde_json = "1"

# SolidRS - 3D asset loading library
solid-rs =   { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
solid-gltf = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
solid-fbx =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
solid-obj =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
solid-usd =  { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
solid-unreal = { git = "https://github.com/Far-Beyond-Pulsar/Solid3D", rev = "61b6638ab5495705117f41401ae2b9c53c3297ed" }
quark = { git = "https://github.com/Far-Beyond-Pulsar/Quark", package = "quark" }
thiserror = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
pollster = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
helio-core = { path = "crates/helio-core" }
helio-scene-join = { path = "crates/helio-scene-join" }
helio-settings = { path = "crates/helio-settings" }
helio-bake-types = { path = "crates/helio-bake-types" }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241", features = ["gpu"] }
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "017252c3c84331a29e53eaa627185597954a3241" }
# Must stay pinned to the exact rev pulsar_scenedb's own Cargo.toml pins --
# a different rev is a different SourceId and thus a second,
# type-incompatible copy of this crate in the build (see helio-wasm's
# BufferKey mismatch, hit and fixed earlier from exactly this). Every crate
# that needs the Reflectable derive should depend on this workspace entry,
# never its own direct git pin -- same reasoning as pulsar_scenedb's fleet
# of stale per-crate pins fixed in the same session.
pulsar_reflection = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Reflection", rev = "091eae569b4dce9de7def958e8a77ff620b07047" }
helio-presets = { path = "crates/helio-presets" }
helio-scene-derivations = { path = "crates/helio-scene-derivations" }
helio-components = { path = "crates/helio-components" }
wasm-bindgen = "0.2"
helio-pass-tsr = { path = "crates/passes/3d/helio-pass-tsr" }
helio-pass-postprocess = { path = "crates/passes/3d/helio-pass-postprocess" }
helio = { path = "crates/helio" }
helio-xr = { path = "crates/helio-xr" }
helio-pass-sdf = { path = "crates/passes/3d/helio-pass-sdf" }
helio-pass-fxaa = { path = "crates/passes/3d/helio-pass-fxaa" }
helio-pass-buffer-view = { path = "crates/passes/3d/helio-pass-buffer-view" }
helio-pass-hiz = { path = "crates/passes/3d/helio-pass-hiz" }
helio-controls = { path = "crates/helio-controls" }
microfont = "3.7.8"

# wgpu 30.0.1: the upstream v30.0.1 tag plus Helio's patches, on
# Far-Beyond-Pulsar/wgpu branch helio/v30.0.1 (texture tracker start states,
# which put HiZ mips in the wrong Vulkan layout; handles compared by instance
# and id). Every crate of the wgpu workspace is patched together so naga and
# wgpu-types stay one version. Pulsar-Native's root manifest carries the same
# section.
[patch.crates-io]
naga = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-apple = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-emscripten = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-hal = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-naga-bridge = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }
wgpu-types = { git = "https://github.com/Far-Beyond-Pulsar/wgpu", branch = "helio/v30.0.1" }

# The vg_stress build script decompresses and converts ~570 MB of scans; build
# scripts default to opt-level 0 even in release, which would be glacial.
[profile.release.build-override]
opt-level = 3
