[package]
name = "helio-components"
version = "0.1.0"
edition = "2021"
description = "SceneDB components for Helio's standalone hosts (examples, demos, wasm, tests) of the kinds Helio still has (lights, materials, billboards, reflection captures). Engines register their own; the renderer never depends on this crate."
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
gpu = []
bake = ["dep:helio-bake"]

[dependencies]
helio = { path = "../helio" }
helio-bake = { path = "../helio-bake", optional = true }
helio-core = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
# `#[derive(SceneStore)]` expands to `::serde_json`, `::wgpu` and reflection paths.
pulsar_reflection = { workspace = true }
serde_json = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
helio-mats = { workspace = true }
log = { workspace = true }
helio-pass-billboard = { path = "../passes/3d/helio-pass-billboard" }
helio-pass-deferred-light = { path = "../passes/3d/helio-pass-deferred-light" }
helio-pass-light-cull = { workspace = true }

[dev-dependencies]
helio = { path = "../helio" }
helio-bake = { path = "../helio-bake" }
