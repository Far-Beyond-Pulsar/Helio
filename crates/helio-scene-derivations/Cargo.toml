[package]
name = "helio-scene-derivations"
version = "0.1.0"
edition = "2021"
workspace = "../../"
description = "Scene derivations Helio's hosts run between the SceneDB snapshot and the graph: the mesh and light joins, hierarchy resolve, texture means."
license = "MIT OR Apache-2.0"

[dependencies]
helio-mesh-api = { workspace = true }
helio-frame-api = { path = "../helio-frame-api" }
helio = { path = "../helio" }
helio-core = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-light-cull = { path = "../passes/3d/helio-pass-light-cull" }
helio-mats = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }

[dev-dependencies]
helio-pass-light-cull = { path = "../passes/3d/helio-pass-light-cull" }
helio-pass-foliage-place = { path = "../passes/3d/helio-pass-foliage-place" }
helio-pass-water-sim = { path = "../passes/3d/helio-pass-water-sim" }
helio-components = { path = "../helio-components" }
helio-pass-gbuffer = { path = "../passes/3d/helio-pass-gbuffer" }
pulsar_scenedb = { workspace = true }
