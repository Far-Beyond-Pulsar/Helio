[package]
name = "helio-scene-derivations"
version = "0.1.0"
edition = "2021"
workspace = "../../"
description = "Scene derivations Helio's hosts run between the SceneDB snapshot and the graph: the mesh and light joins, hierarchy resolve, the environment join, portal projection, texture means."
license = "MIT OR Apache-2.0"

[dependencies]
helio = { path = "../helio" }
helio-core = { workspace = true }
helio-mats = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
pollster = { workspace = true }
helio-pass-corona = { path = "../passes/3d/helio-pass-corona" }
helio-pass-decal = { path = "../passes/3d/helio-pass-decal" }
helio-pass-foliage-place = { path = "../passes/3d/helio-pass-foliage-place" }
helio-pass-lens = { workspace = true }
helio-pass-sky = { path = "../passes/3d/helio-pass-sky" }
helio-pass-sprite-batch = { path = "../passes/2d/helio-pass-sprite-batch" }
helio-pass-water-sim = { path = "../passes/3d/helio-pass-water-sim" }
helio-pass-portal-cull = { path = "../passes/3d/helio-pass-portal-cull" }
helio-pass-portal-instances = { path = "../passes/3d/helio-pass-portal-instances" }

[dev-dependencies]
helio-components = { path = "../helio-components" }
helio-pass-gbuffer = { path = "../passes/3d/helio-pass-gbuffer" }
pulsar_scenedb = { workspace = true }
