[package]
name = "helio-core"
version = "0.1.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "GPU-driven rendering core with trait-based architecture"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
thiserror = { workspace = true }
libhelio = { workspace = true }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5", features = ["gpu"] }
helio-voxel-core = { workspace = true }
naga = { version = "30.0.0", features = ["wgsl-in"] }

[dev-dependencies]
pollster = { workspace = true }

[features]
default = ["profiling"]
profiling = []
