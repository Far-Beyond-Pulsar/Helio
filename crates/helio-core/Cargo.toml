[package]
name = "helio-core"
version = "0.1.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "GPU-driven rendering core with trait-based architecture"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
thiserror = { workspace = true }
pulsar_scenedb = { workspace = true }
naga = { version = "30.0.0", features = ["wgsl-in"] }

# Pulsar-Profiling fork scopes (same instrumentation the engine flamegraph
# collects). The fork is std-only, so it is excluded on wasm targets. The
# module code gates every `profiling::profile_scope!` site with the same cfg.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
profiling = { workspace = true, optional = true }
# Shader hot reload: native only (the watcher reads the source tree).
notify = { workspace = true, optional = true }
log = { workspace = true, optional = true }

[dev-dependencies]
pollster = { workspace = true }
helio-mats = { workspace = true }
helio-pass-hiz = { workspace = true }
helio-pass-foliage-place = { workspace = true }
helio-pass-sky = { workspace = true }
helio-pass-volumetric-fog = { workspace = true }
helio-default-graphs = { workspace = true }
helio-pass-voxel-planet = { path = "../passes/3d/helio-pass-voxel-planet" }

[features]
default = ["profiling", "shader-hot-reload"]
profiling = ["dep:profiling"]
# Recompile `.wgsl` files edited while the app runs (see `shader::hot`). On by
# default: steady state costs one atomic load per frame, and a binary with no
# source tree on disk (or `HELIO_SHADER_HOT_RELOAD=0`) never starts the watcher.
# Compiled out on wasm32.
shader-hot-reload = ["dep:notify", "dep:log"]
