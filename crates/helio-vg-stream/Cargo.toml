[package]
name = "helio-vg-stream"
version = "0.1.0"
edition = "2021"
description = "Virtual geometry page streaming: GPU page pool, residency table, request readback, upload scheduler"
license = "MIT OR Apache-2.0"

[dependencies]
helio-vg-format = { path = "../helio-vg-format" }
wgpu = { workspace = true }
pulsar_scenedb = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
pollster = { workspace = true }
helio-vg-build = { path = "../helio-vg-build" }
