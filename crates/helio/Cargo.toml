[package]
name = "helio"
version = "0.19.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "High-level facade over helio-core for stable scene handles and O(1)-style CPU updates"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7"
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
image = { workspace = true, features = ["png"] }
helio-core = { workspace = true }
helio-portal-core = { workspace = true }
helio-foliage-core = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-tsr = { workspace = true }
helio-pass-sky = { workspace = true }

libhelio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
quark.workspace = true
helio-voxel-core = { workspace = true }
helio-bake = { path = "../helio-bake", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
meshopt = "0.6.2"
# MeshPool's vertex/index storage delegates to `VarLenGpuPool` (a growable
# GPU pool + freelist suballocator) instead of hand-rolling its own —
# `helio`'s own `GrowableBuffer`/`FreeListAllocator` (mesh.rs) were an
# independent reimplementation of exactly this. A direct git+rev pin, NOT
# `{ workspace = true }`: this crate stays a normal member of Helio's own
# nested workspace (unlike `helio-scenedb`/`helio-component`, which
# redirect their whole `package.workspace` to Pulsar-Native's root for
# `inventory`-registry identity reasons that don't apply here — MeshPool
# only uses `VarLenGpuPool` as a plain library type, no derive, no
# registry). Must stay byte-for-byte identical to every other direct
# `pulsar_scenedb`/`pulsar_scenedb_derive` rev pin in the Pulsar-Native
# tree (root `Cargo.toml`, `helio-scenedb/Cargo.toml`) so Cargo's
# project-wide resolution unifies them to one compiled instance — a
# mismatched rev here would make `helio::mesh::PackedVertex`'s
# `VarLenGpuPool<PackedVertex>` a DIFFERENT type than the one a
# `#[gpu] Vec<PackedVertex>` component field resolves to elsewhere,
# defeating the whole point of sharing one pool.
#
# HELIO#237 REPONT: de0e524e -> 72291d0f211dc8826eb70339aeb0409be4270ad5 —
# the SceneDB#61 tier-storage substrate (`register_segment_layout`,
# `configure_tiers`/`touch_tier`/`release_tier`, `tier_audit`) that #237's
# texel-streaming S1 codes against, kept in lockstep with Pulsar-Native's
# root `[patch."…/SceneDB"]` repoint (one compiled instance across the seam).
# FLAGGED: 72291d0 lives on an UNPUSHED local branch of the SceneDB checkout
# until SceneDB#61 lands upstream; fetching this rev fails until then. Local
# dev uses a session-local PATH patch (see the #237 final report); do not
# commit one.
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5", features = ["gpu"] }

[features]
default = ["profiling"]
profiling = ["helio-core/profiling"]
bake = ["helio-bake", "uuid"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

# OpenXR (Vulkan) integration. Native-only: helio-xr compiles out entirely on
# wasm32 (its crate root is `#![cfg(not(target_arch = "wasm32"))]`), and the
# openxr/ash/liblocing deps it pulls in do not build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
helio-xr = { workspace = true }
# Matches the openxr version helio-xr builds against; only the session-state /
# frame-state enums used by the XR render loop are referenced directly.
openxr = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
# Used for DXGI exclusive-fullscreen path (IDXGIFactory1::MakeWindowAssociation).
# Version must match wgpu-hal's transitive dep so types are unified.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }
