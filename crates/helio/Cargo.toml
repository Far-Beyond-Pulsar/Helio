[package]
name = "helio"
version = "0.19.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "High-level facade over helio-core for stable scene handles and O(1)-style CPU updates"
license = "MIT OR Apache-2.0"

[dependencies]
arrayvec = "0.7"
bytemuck = { workspace = true, features = ["derive"] }
glam.workspace = true
image = { workspace = true, features = ["png"] }
helio-core = { workspace = true }
helio-portal-core = { workspace = true }
helio-foliage-core = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-tsr = { workspace = true }

libhelio = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
quark.workspace = true
helio-voxel-core = { workspace = true }
helio-bake = { path = "../helio-bake", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
meshopt = "0.6.2"
# CPU archetype ECS backing + GPU world-mirror bridge (Helio #210). The `gpu`
# feature is required because Scene holds Arc<SceneGpuStore> + the GpuMirrorHandle
# attachment. The dep's `gpu` feature is always-on; the crate's own `gpu` feature
# gates the derive's #[cfg(feature = "gpu")] spliced code (same pattern as
# helio-scenedb). Originally added CPU-only by draft PR #209 (scenedb-object-storage).
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", features = ["gpu"] }
# Proc-macro derive for SceneStore — needed by library types. Version matches
# pulsar_scenedb's own pinned git rev through the workspace Cargo.lock.
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB" }

[features]
default = ["profiling", "gpu"]
profiling = ["helio-core/profiling"]
gpu = []
bake = ["helio-bake", "uuid"]

[dev-dependencies]
# World-mirror integration test (Helio #210) needs #[derive(SceneStore)].
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

# OpenXR (Vulkan) integration. Native-only: helio-xr compiles out entirely on
# wasm32 (its crate root is `#![cfg(not(target_arch = "wasm32"))]`), and the
# openxr/ash/liblocing deps it pulls in do not build for wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
helio-xr = { workspace = true }
# Matches the openxr version helio-xr builds against; only the session-state /
# frame-state enums used by the XR render loop are referenced directly.
openxr = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
# Used for DXGI exclusive-fullscreen path (IDXGIFactory1::MakeWindowAssociation).
# Version must match wgpu-hal's transitive dep so types are unified.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi"] }
