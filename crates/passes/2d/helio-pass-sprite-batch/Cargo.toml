[package]
name = "helio-pass-sprite-batch"
version = "0.1.0"
edition = "2021"
description = "Helio 2D pass: GPU-instanced sprite batcher with texture atlasing"
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
libhelio   = { workspace = true }
wgpu       = { workspace = true }
bytemuck   = { workspace = true, features = ["derive"] }
glam       = { workspace = true }
log        = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_reflection = { workspace = true }
serde_json = { workspace = true }
