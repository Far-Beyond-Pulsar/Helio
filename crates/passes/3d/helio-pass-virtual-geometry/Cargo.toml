[package]
name = "helio-pass-virtual-geometry"
version = "0.1.0"
edition = "2021"
authors = ["Helio Contributors"]
description = "GPU-driven virtual geometry pass: per-meshlet frustum + backface-cone culling followed by an indirect GBuffer draw"
license = "MIT OR Apache-2.0"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
helio-core = { workspace = true }
helio-mats = { workspace = true }
helio-pass-gbuffer = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-pass-radiance-cascades = { workspace = true }
log = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu = { workspace = true }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in"] }
