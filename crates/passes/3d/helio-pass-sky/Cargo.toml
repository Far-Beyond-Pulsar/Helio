[package]
name = "helio-pass-sky"
version = "0.1.0"
edition = "2021"
description = "Helio atmosphere (sky) passes"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-frame-api = { path = "../../../helio-frame-api" }
helio-feature-api = { path = "../../../helio-feature-api" }
pulsar_reflection = { workspace = true }
helio-core = { workspace = true }
helio-sky-api = { path = "../../../api/helio-sky-api" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
helio-components = { path = "../../../helio-components" }
pollster = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
