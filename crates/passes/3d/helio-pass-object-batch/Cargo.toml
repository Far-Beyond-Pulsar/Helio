[package]
name = "helio-pass-object-batch"
version = "0.1.0"
edition = "2021"
description = "GPU-driven sort/group/batch pipeline: turns SceneDB's StaticObjectComponent rows into instances/draw_calls/material_class_ranges with zero per-frame CPU involvement"

[dependencies]
helio-feature-api = { path = "../../../helio-feature-api" }
helio-frame-api = { path = "../../../helio-frame-api" }
helio-scene-join = { workspace = true }
glam = { workspace = true }
helio-core = { workspace = true }
helio-pass-gbuffer = { path = "../helio-pass-gbuffer" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
helio-components = { path = "../../../helio-components" }
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
