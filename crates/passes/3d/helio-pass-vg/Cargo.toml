[package]
name = "helio-pass-vg"
version = "0.1.0"
edition = "2021"
workspace = "../../../../"
description = "Virtual geometry's graph glue as a Helio feature: the pass chain, its order, and the passes that tie the streaming store to the graph."
license = "MIT OR Apache-2.0"

[dependencies]
helio-frame-api = { path = "../../../helio-frame-api" }
helio-core = { workspace = true }
helio-feature-api = { path = "../../../helio-feature-api" }
wgpu = { workspace = true }
log = { workspace = true }
helio-vg-format = { path = "../../../helio-vg-format" }
helio-vg-stream = { path = "../../../helio-vg-stream" }
helio-pass-vg-bvh = { path = "../helio-pass-vg-bvh" }
helio-pass-vg-cull = { path = "../helio-pass-vg-cull" }
helio-pass-vg-raster = { path = "../helio-pass-vg-raster" }
helio-pass-vg-dense = { path = "../helio-pass-vg-dense" }
helio-pass-vg-shade = { path = "../helio-pass-vg-shade" }
