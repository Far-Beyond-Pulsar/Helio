[package]
name = "helio-pass-portal-instances"
version = "0.1.0"
edition = "2021"
description = "Draws portal-duplicated instances (from helio-pass-portal-cull) into the G-buffer, clipped to each portal's opening"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-core = { workspace = true }
libhelio = { workspace = true }
helio-pass-portal-cull = { workspace = true }
helio-pass-gbuffer = { path = "../helio-pass-gbuffer" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5", features = ["gpu"] }
