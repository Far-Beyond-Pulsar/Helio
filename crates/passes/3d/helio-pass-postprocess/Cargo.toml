[package]
name = "helio-pass-postprocess"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: GPU-native post-processing pipeline (bloom, tonemap, color grading, vignette, CA, grain, DOF, motion blur)"
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
libhelio = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5", features = ["gpu"] }
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5" }
