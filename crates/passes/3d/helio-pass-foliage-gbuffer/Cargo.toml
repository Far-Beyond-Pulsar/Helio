[package]
name = "helio-pass-foliage-gbuffer"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: foliage blade/card rasterisation into the G-buffer"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-frame-api = { path = "../../../helio-frame-api" }
helio-feature-api = { path = "../../../helio-feature-api" }
helio-core         = { workspace = true }
helio-pass-foliage-place = { workspace = true }
wgpu               = { workspace = true }
bytemuck           = { workspace = true, features = ["derive"] }
log                = { workspace = true }
pulsar_scenedb = { workspace = true }
