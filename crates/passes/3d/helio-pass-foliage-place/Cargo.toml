[package]
name = "helio-pass-foliage-place"
version = "0.1.0"
edition = "2021"
description = "Foliage tile residency, GPU placement, tile/cluster culling and per-LOD compaction for Helio"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-scene-join = { path = "../../../helio-scene-join" }
helio-settings = { workspace = true }
pulsar_reflection = { workspace = true }
glam = { workspace = true }
helio-core = { workspace = true }
helio-foliage-api = { path = "../../../api/helio-foliage-api" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }
serde_json = { workspace = true }
