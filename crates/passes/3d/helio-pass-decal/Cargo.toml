[package]
name = "helio-pass-decal"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: decal projection (bullet holes, cracks, stickers)"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-core = { workspace = true }
libhelio = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5", features = ["gpu"] }
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5" }

[dev-dependencies]
naga = { version = "30.0.0", features = ["wgsl-in", "glsl-out"] }
pollster = { workspace = true }
