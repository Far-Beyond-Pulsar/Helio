[package]
name = "helio-pass-portal-cull"
version = "0.1.0"
edition = "2021"
description = "Per-portal GPU frustum culling: selects which instances get a duplicate draw through each active portal"

[features]
default = ["gpu"]
gpu = []

[dependencies]
glam = { workspace = true }
helio-core = { workspace = true }
libhelio = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "72291d0f211dc8826eb70339aeb0409be4270ad5" }
