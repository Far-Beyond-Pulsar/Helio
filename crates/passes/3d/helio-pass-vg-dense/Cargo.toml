[package]
name = "helio-pass-vg-dense"
version = "0.1.0"
edition = "2021"
description = "Virtual geometry Tier 3 (ultra-dense overlap): tiled depth-peel compute raster (3-NonRT) and ray-query primary visibility over proxy-LOD BLASes (3-RT)"
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
helio-vg-format = { workspace = true }
helio-pass-vg-cull = { path = "../helio-pass-vg-cull" }
helio-pass-vg-raster = { path = "../helio-pass-vg-raster" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
glam = { workspace = true }
