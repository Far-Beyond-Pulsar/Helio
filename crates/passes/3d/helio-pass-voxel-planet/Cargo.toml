[package]
name = "helio-pass-voxel-planet"
version = "0.1.0"
edition = "2021"
description = "Destructible cube-sphere voxel planet: canonical data, queries and the Helio GBuffer pass"
license = "MIT OR Apache-2.0"

[features]
default = ["engine"]
# Helio render-graph integration (GPU residency, tracing, GBuffer).
engine = ["dep:helio-core", "dep:helio-mats", "dep:helio-pass-gi", "dep:helio-pass-foliage-place", "dep:helio-pass-shadow-matrix", "dep:wgpu", "dep:image", "dep:miniz_oxide"]

[dependencies]
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.1"
# Brush baking and coarse rebuilds across cores (`edit_store`).
rayon = "1.12"
# Host settings (`ResidencyConfig::from_settings`).
helio-settings = { workspace = true }
wgpu = { version = "30.0.1", optional = true }
helio-core = { workspace = true, optional = true }
# Specular anti-aliasing for the scene materials' normal maps.
helio-mats = { workspace = true, optional = true }
helio-pass-gi = { workspace = true, optional = true }
# Foliage grows on the terrain (`chunks::ground`).
helio-pass-foliage-place = { workspace = true, optional = true }
helio-pass-shadow-matrix = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Kept chunks in edit snapshots (`ChunkWorld::kept_snapshot`).
miniz_oxide = { version = "0.8", optional = true }

[dev-dependencies]
pollster = "0.4"
# examples/shader_stats.rs: driver statistics of the compute pipelines.
ash = "0.38"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
