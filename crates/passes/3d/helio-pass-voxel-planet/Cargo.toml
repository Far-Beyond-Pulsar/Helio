[package]
name = "helio-pass-voxel-planet"
version = "0.1.0"
edition = "2021"
description = "Destructible cube-sphere voxel planet: canonical data, queries and the Helio GBuffer pass"
license = "MIT OR Apache-2.0"

[features]
default = ["engine"]
# Helio render-graph integration (GPU residency, tracing, GBuffer).
engine = ["dep:helio-core", "dep:wgpu"]

[dependencies]
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2.1"
wgpu = { version = "30.0.1", optional = true }
helio-core = { workspace = true, optional = true }

[dev-dependencies]
pollster = "0.4"
