[package]
name = "helio-pass-tsr"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: Temporal Super-Resolution (TSR)"
license = "MIT OR Apache-2.0"

[dependencies]
helio-frame-api = { path = "../../../helio-frame-api" }
helio-core = { workspace = true }
wgpu       = { workspace = true }
bytemuck   = { workspace = true, features = ["derive"] }

[dev-dependencies]
glam     = { workspace = true }
pollster = { workspace = true }
# The frame's reprojection TSR reads, published in the tests as the spine does.
helio-pass-history = { path = "../helio-pass-history" }
half     = { version = "2", features = ["bytemuck"] }
