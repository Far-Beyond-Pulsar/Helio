[package]
name = "helio-pass-ssr"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: screen-space reflections"
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
helio-pass-hiz = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = { workspace = true }
