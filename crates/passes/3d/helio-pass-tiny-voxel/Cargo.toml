[package]
name = "helio-pass-tiny-voxel"
version = "0.1.0"
edition = "2021"
description = "Window-independent 10 cm voxel planet compute pass"

[features]
engine = ["dep:helio-core"]

[dependencies]
wgpu = "30.0.1"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
helio-core = { workspace = true, optional = true }

[dev-dependencies]
pollster = "0.4"
