[package]
name = "helio-pass-tiny-voxel"
version = "0.1.0"
edition = "2021"
description = "Window-independent 10 cm voxel planet compute pass"

[features]
engine = ["dep:helio-core", "dep:rustc-hash"]
# Opt-in architecture trial; linear edit scans and traversal cost are unqualified.
canonical-far-experiment = ["engine"]
# Offline spatial reference: materialize camera rays before canonical traversal.
surface-reference = ["canonical-far-experiment"]
# Candidate regional publication; retain complete-cut default until qualified.
regional-publication-experiment = ["engine"]
# Opt-in bounded local patch accelerator; whole-planet performance unqualified.
surface-cache-experiment = ["surface-reference"]

[dependencies]
wgpu = "30.0.1"
glam = { version = "0.33", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
helio-core = { workspace = true, optional = true }
rustc-hash = { version = "2.1", optional = true }

[dev-dependencies]
pollster = "0.4"
