[package]
name = "helio-pass-post-volumes"
version = "0.1.0"
edition = "2021"
workspace = "../../../../"
description = "Post-process volumes as a Helio feature: the camera and volume rows and the pass that blends them into the frame's post settings, which the tone map reads."
license = "MIT OR Apache-2.0"

[dependencies]
helio-scene-join = { path = "../../../helio-scene-join" }
helio-core = { workspace = true }
helio-feature-api = { path = "../../../helio-feature-api" }
helio-frame-api = { path = "../../../helio-frame-api" }
helio-pass-postprocess = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
