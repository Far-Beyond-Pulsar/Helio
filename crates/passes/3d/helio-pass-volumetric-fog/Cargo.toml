[package]
name = "helio-pass-volumetric-fog"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: helio-pass-volumetric-fog"
license = "MIT OR Apache-2.0"

[features]
default = ["gpu"]
gpu = []

[dependencies]
helio-frame-api = { path = "../../../helio-frame-api" }
helio-feature-api = { path = "../../../helio-feature-api" }
pulsar_reflection = { workspace = true }
helio-core = { workspace = true }
helio-pass-postprocess = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }
helio-sky-api = { path = "../../../api/helio-sky-api" }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }

[dev-dependencies]
helio-pass-post-volumes = { path = "../helio-pass-post-volumes" }
helio-components = { path = "../../../helio-components" }
pollster = { workspace = true }
glam = { workspace = true }
