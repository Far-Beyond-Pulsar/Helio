[package]
name = "helio-pass-hlfs"
version = "0.1.0"
edition = "2021"
description = "Helio render pass: Hierarchical Light-Field Sampling (HLFS)"
license = "MIT OR Apache-2.0"

[dependencies]
helio-bake-types = { workspace = true }
helio-feature-api = { path = "../../../helio-feature-api" }
helio-frame-api = { path = "../../../helio-frame-api" }
helio-core  = { workspace = true }
wgpu      = { workspace = true }
bytemuck  = { workspace = true, features = ["derive"] }
glam      = { workspace = true }
helio-pass-shadow-matrix = { workspace = true }

[dev-dependencies]
helio-mesh-api = { workspace = true }
helio-pass-gbuffer = { path = "../helio-pass-gbuffer" }
helio-components = { path = "../../../helio-components" }
pollster = { workspace = true }
naga = { version = "30", features = ["wgsl-in"] }
image = { workspace = true }
half = "2"
helio-pass-light-cull = { workspace = true }
# The SceneDB projection tests in `tests/gpu_hlfs_rt.rs` drive the frontend's
# `helio_default_passes::ray_tracing` adapter; the pass itself reads no World.
helio-presets = { workspace = true }
pulsar_scenedb = { workspace = true }
helio-pass-object-batch = { workspace = true }
helio-mats = { workspace = true }
