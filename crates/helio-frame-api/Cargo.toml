[package]
name = "helio-frame-api"
version = "0.1.0"
edition = "2021"
workspace = "../../"
description = "The frame every object kind meets at: extension points and draw phases, the G-buffer layout, the colour chain, lighting-input contracts with stand-ins, and host inputs. Knows no kind of object."
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
bytemuck = { workspace = true }
# The history's reprojection, composed in f64 (`history::HistoryReprojection`).
glam = { workspace = true }
helio-feature-api = { path = "../helio-feature-api" }
wgpu = { workspace = true }

[dev-dependencies]
# The contracts' WGSL layouts, measured (`tests/layouts.rs`).
naga = { version = "30.0.0", features = ["wgsl-in"] }
# The contracts' build-time tests run on wgpu's no-op device.
wgpu = { workspace = true, features = ["noop"] }
# The surface encodings' round trip runs on a real device (`tests/surface_gpu.rs`).
pollster = { workspace = true }
