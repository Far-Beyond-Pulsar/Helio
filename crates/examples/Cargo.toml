[package]
name = "examples"
version = "0.1.0"
edition = "2021"
description = "Helio's own examples: what Helio is without an object kind (a custom graph, the debug draw). Scenes of meshes are the meshes plugin's examples (Pulsar plugins/vendor/meshes/examples)."

[[bin]]
name = "debug_shapes"
path = "debug_shapes.rs"

[[bin]]
name = "simple_graph"
path = "simple_graph.rs"

[dependencies]
helio = { workspace = true }
helio-presets = { path = "../helio-presets" }
# simple_graph's own pass (simple_cube.rs).
helio-core = { workspace = true }
helio-frame-api = { path = "../helio-frame-api" }
bytemuck = { workspace = true, features = ["derive"] }
pulsar_scenedb = { workspace = true }
scenedb-inspector-agent = { path = "../scenedb-inspector-agent" }
glam = { workspace = true }
winit = { workspace = true }
env_logger = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
