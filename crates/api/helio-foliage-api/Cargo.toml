[package]
name = "helio-foliage-api"
version = "0.1.0"
edition = "2021"
description = "The foliage feature's public contract: GPU records, packing, placement reference maths, the ground protocol, SceneDB rows and the shared WGSL. No wgpu."
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
pulsar_scenedb = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
