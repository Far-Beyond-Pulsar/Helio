[package]
name = "helio-gi-api"
version = "0.1.0"
edition = "2021"
description = "The GI feature's public contract: the probe clipmap's layout, the rays, hits and irradiance it publishes, and the WGSL that reads them."
license = "MIT OR Apache-2.0"

[dependencies]
helio-frame-api = { path = "../../helio-frame-api" }
helio-core = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
