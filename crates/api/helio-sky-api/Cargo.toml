[package]
name = "helio-sky-api"
version = "0.1.0"
edition = "2021"
description = "The sky feature's public contract: the cloud shadow it publishes and the WGSL that reads it; re-exports the frame's sky lighting inputs it publishes (atmosphere frame, sky table, sun visibility)."
