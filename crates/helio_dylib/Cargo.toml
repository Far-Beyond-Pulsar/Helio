[package]
name = "helio_dylib"
version = "0.1.1"
edition = "2021"
publish = false
description = "Helio's kernel (core, tasks, the frame and feature contracts, the graph, presets) as one shared Rust dylib, on top of the SceneDB, reflection, profiling and UI libraries. A binary or plugin library that links it shares one Helio: its shader registry, pipeline caches and task host exist once per process. Built with `-C prefer-dynamic` (.cargo/config.toml)."

[lib]
crate-type = ["dylib"]

[dependencies]
# One copy of each, from their own libraries.
wgpui_dylib = { git = "https://github.com/Far-Beyond-Pulsar/WGPUI" }
profiling_dylib = { git = "https://github.com/Far-Beyond-Pulsar/Pulsar-Profiling" }
scenedb_dylib = { git = "https://github.com/Far-Beyond-Pulsar/SceneDB", rev = "2e9ae1ff9dec935bf94b73cfa38c01d27e8ce256" }
helio = { path = "../helio" }
helio-core = { path = "../helio-core" }
helio-tasks = { path = "../helio-tasks" }
helio-feature-api = { path = "../helio-feature-api" }
helio-frame-api = { path = "../helio-frame-api" }
helio-spine = { path = "../helio-spine" }
helio-scene-join = { path = "../helio-scene-join" }
helio-scene-derivations = { path = "../helio-scene-derivations" }
helio-graph-asset = { path = "../helio-graph-asset" }
helio-presets = { path = "../helio-presets" }
helio-settings = { path = "../helio-settings" }
helio-components = { path = "../helio-components" }
