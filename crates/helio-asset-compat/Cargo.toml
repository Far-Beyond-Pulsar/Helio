[package]
name = "helio-asset-compat"
version = "0.1.0"
edition = "2021"
workspace = "../../"
description = "SolidRS integration layer for Helio renderer - asset loading and conversion"

[dependencies]
# Helio renderer facade
helio = { workspace = true }
helio-mats = { path = "../helio-mats" }
helio-pass-forward-lit = { path = "../passes/3d/helio-pass-forward-lit" }

# SceneDB: material rows spawned by `upload_scene_materials` are plain
# `helio_pass_gbuffer::MaterialComponent` rows now, same as everywhere else.
pulsar_scenedb = { workspace = true }
helio-pass-gbuffer = { path = "../passes/3d/helio-pass-gbuffer" }

# SolidRS - 3D asset loading
solid-rs = { workspace = true, features = ["configurator"] }
solid-gltf = { workspace = true, features = ["configurator"] }
solid-fbx = { workspace = true, features = ["configurator"] }
solid-obj = { workspace = true, features = ["configurator"] }
solid-usd = { workspace = true, features = ["configurator"] }
solid-unreal = { workspace = true }

# Math and utilities
glam.workspace = true
log.workspace = true
thiserror = { workspace = true }

# GPU
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }

# Image decoding
image = { workspace = true, features = ["png", "jpeg"] }
