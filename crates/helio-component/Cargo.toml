[package]
name = "helio_component"
version = "0.1.0"
edition = "2024"

# This crate is a member of Helio's OWN separate Cargo workspace by directory
# nesting (`crates/renderer/helio/Cargo.toml`'s `members = ["crates/*", ...]`
# glob picks it up automatically) -- BUT it explicitly belongs to
# Pulsar-Native's workspace instead, via this override. This matters for
# correctness, not just style: `pulsar_scenedb`/`pulsar_reflection`/
# `pulsar_world_registry` all use `inventory`-based global registration
# (`#[register_world_component]`, `#[register_runtime_behavior]`, reflection
# `REGISTRY` statics) -- two compiled copies of the SAME crate (e.g. one
# pinned to a different git rev than the other) get two SEPARATE registries
# that can't see each other's registrations, even though the code looks
# identical. `engine_backend`/`ui_level_editor` (the live editor this crate's
# components are registered into) are built as part of Pulsar-Native's root
# workspace resolution, pinned to specific git revs there
# (`pulsar_scenedb` @ `43921b0d...`, `pulsar_reflection` @ `b0d9b957...`, see
# root Cargo.toml). For `LightComponent`/`StaticMeshComponent`/etc. registered
# here to actually be visible to the live `World` the properties panel reads
# and writes, this crate's own `pulsar_scenedb`/`pulsar_reflection`/
# `pulsar_world_registry` MUST resolve to those SAME exact sources -- not
# `helio-scenedb`'s own, separately-pinned, local-dev-path `pulsar_scenedb`
# (a different, unmerged branch). `workspace = "../../../../.."` makes this
# crate inherit from Pulsar-Native's root `[workspace.dependencies]` (and
# root `[patch]` table) instead of Helio's own, so the deps below that use
# `{ workspace = true }` resolve identically to how `engine_backend` resolves
# them -- guaranteeing one shared copy, not two.
workspace = "../../../../.."

[features]
# `#[derive(SceneStore)]`'s generated GPU-column methods (`register_gpu_
# columns`/`register_gpu_columns_growable`/the world-mirror dispatch
# registration, ...) are wrapped in `#[cfg(feature = "gpu")]`. That `cfg`,
# spliced into THIS crate by `#[engine_class(scene_store, ...)]`'s macro
# expansion on `StaticMeshComponent` (Pulsar-Native#561 Phase D), checks
# THIS crate's own Cargo features -- not `pulsar_scenedb`'s (already on via
# the `features = ["gpu"]` on its root-workspace dependency spec) -- so this
# crate needs its own feature of exactly this name too, same gotcha
# `helio-scenedb/Cargo.toml` documents for the identical situation. On by
# default: every `scene_store` component defined here wants its `#[gpu]`
# fields live, not opt-in per build.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
# M3-alpha Task 2 (audit follow-up): `prims-gpui` is required here — this
# crate defines its own GPUI property editors (`render_script_asset_editor`,
# `render_mesh_asset_editor` in src/components/{script,static_mesh}_component.rs)
# via `#[pulsar_reflection::pulsar_type(editor = ...)]`, which needs
# `pulsar_reflection::PropertyEditorArgs`'s GPUI-typed fields and
# `erase_property_editor_fn_ptr`. `gpui-ce`/`ui` are already unconditional
# deps of this crate below, so this only affects `pulsar_reflection`'s own
# feature set, not this crate's dependency tree.
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
pulsar_events = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true, features = ["serde"] }
helio.workspace = true
libhelio.workspace = true
helio-asset-compat = { workspace = true }
helio-planet-voxel-core = { workspace = true }
helio-pass-planetary-voxel = { workspace = true }
pulsar_terrain.workspace = true
thiserror.workspace = true
wgpu.workspace = true
gpui-ce.workspace = true
ui.workspace = true
ui_common.workspace = true
plugin_editor_api.workspace = true
engine_fs.workspace = true
engine_state.workspace = true
engine_subsystems.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
twox-hash.workspace = true
# ContentLedger's shard locks: workspace-standard parking_lot (no poisoning,
# smaller/faster than std::sync::Mutex) -- the house choice for
# fine-grained locking elsewhere in this workspace.
parking_lot.workspace = true

[dev-dependencies]
pollster = "=0.4.0"
# Bench infrastructure (criterion) follows SceneDB's existing convention
# (`criterion = { version = "=0.8.2" }`, harness = false benches): the
# ledger-throughput / hashing / dedup benchmarks this crate needs measure
# PULSAR-side types (ContentLedger, ContentId, the hydrate dedup layer)
# that don't exist in SceneDB, so its bench suite can't host them.
criterion = { version = "=0.8.2" }

[[bench]]
name = "content_infra"
harness = false

[[test]]
name = "static_mesh_component_gpu_mirror"
required-features = ["gpu"]

[lints]
workspace = true
