[package]
name = "helio-scene-join"
version = "0.1.0"
edition = "2021"
workspace = "../../"
description = "Scene derivation building blocks no kind owns: the owner/transform row layouts every join reads, and RowJoin, which places a kind's component rows into the rows its passes read. Each kind configures its own RowJoin."
license = "MIT OR Apache-2.0"

[dependencies]
helio-core = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
glam = { workspace = true }
log = { workspace = true }
