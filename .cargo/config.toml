[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\""]

[alias]
# Run the VG museum; the first run downloads and prepares the Stanford scans.
vg-stress = "run -p examples --features vg-stress --bin vg_stress --release"

# Every platform links `std` and this repository's shared library dynamically (`-C prefer-dynamic`). The
# library sits beside the executable; a plugin library sits two folders below it.
[target.'cfg(not(target_family = "wasm"))']
rustflags = ["-C", "prefer-dynamic"]

[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../.."]

[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path", "-C", "link-arg=-Wl,-rpath,@loader_path/../.."]
